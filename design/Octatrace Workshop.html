&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;

  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

    }

    }

      postToHost(&quot;follow-up&quot;, { context, prompt, title });

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||

      privateContent: null,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

    }

      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#octatrace-bench{--ob-orange:#f46628;--ob-charcoal:#252525;--ob-ink:#111920;--ob-paper:#f7f5f1;--ob-line:#dededb;--ob-muted:#656864;--ob-green:#24684c;--ob-green-soft:#edf5ef;--ob-red:#a33d2c;--ob-row:66px;color:var(--ob-ink);font:400 13px/1.5 BenchExcon,Arial,sans-serif;color-scheme:light}
#octatrace-bench *{box-sizing:border-box}
#octatrace-bench [hidden]{display:none!important}
#octatrace-bench button,#octatrace-bench input,#octatrace-bench select{font:inherit}
#octatrace-bench button{color:inherit}
#octatrace-bench button:disabled{opacity:.45;cursor:not-allowed}
#octatrace-bench button:focus-visible,#octatrace-bench input:focus-visible,#octatrace-bench select:focus-visible{outline:3px solid var(--ob-orange);outline-offset:3px}
#octatrace-bench .ob-window{position:relative;background:#fff;border:1px solid #d8d8d4;border-radius:14px;overflow:hidden}
#octatrace-bench .ob-titlebar{min-height:36px;background:var(--ob-paper);border-bottom:1px solid var(--ob-line);display:flex;align-items:center;padding:8px 15px;gap:13px;color:#666862;font-size:11px}
#octatrace-bench .ob-traffic{display:flex;gap:6px}
#octatrace-bench .ob-traffic span{width:9px;height:9px;border-radius:50%;background:#c7c5c0}
#octatrace-bench .ob-titlebar strong{font-weight:500;color:var(--ob-charcoal)}
#octatrace-bench .ob-preview{margin-left:auto;letter-spacing:.04em}
#octatrace-bench .ob-shell{display:grid;grid-template-columns:172px minmax(0,1fr);min-height:760px}
#octatrace-bench .ob-sidebar{background:var(--ob-charcoal);color:var(--ob-paper);padding:29px 16px 18px;display:flex;flex-direction:column;gap:28px}
#octatrace-bench .ob-brand{padding:0 9px}
#octatrace-bench .ob-wordmark{display:block;width:132px;height:auto}
#octatrace-bench .ob-product{font-size:11px;letter-spacing:.16em;color:var(--ob-orange);margin-top:9px}
#octatrace-bench .ob-nav{display:grid;gap:6px}
#octatrace-bench .ob-nav button{border:0;background:transparent;color:#d1d1cd;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:left;border-radius:8px}
#octatrace-bench .ob-nav button[aria-current=page]{background:#3a3936;color:#fff}
#octatrace-bench .ob-nav button[aria-current=page] i,#octatrace-bench .ob-nav button[aria-current=page] svg{color:var(--ob-orange)}
#octatrace-bench i[data-lucide],#octatrace-bench svg.lucide{width:17px;height:17px;flex-shrink:0}
#octatrace-bench .ob-sidebar-note{font-size:11px;color:#babcb7;padding:0 10px;line-height:1.7}
#octatrace-bench .ob-user{margin-top:auto;padding:18px 9px 0;border-top:1px solid #454541}
#octatrace-bench .ob-avatar{width:30px;height:30px;display:grid;place-items:center;background:#55544e;color:#fff;border-radius:50%;font-size:11px;float:left;margin-right:9px}
#octatrace-bench .ob-user small{display:block;color:#c4c5bd;font-size:11px}
#octatrace-bench .ob-signout{border:0;background:none;color:#e0e0d9;font-size:11px;margin:14px 0 0;padding:0;display:flex;gap:7px;align-items:center}
#octatrace-bench .ob-main{min-width:0;padding:23px 26px 22px;background:#fff}
#octatrace-bench .ob-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(--ob-muted);margin-bottom:23px}
#octatrace-bench .ob-registry{background:var(--ob-green-soft);border:0;border-radius:20px;padding:5px 10px;display:flex;align-items:center;gap:6px;color:var(--ob-green);font-size:11px}
#octatrace-bench .ob-registry.offline{background:#fff1e6;color:#965220}
#octatrace-bench .ob-dot{width:6px;height:6px;background:currentColor;border-radius:50%;display:inline-block;flex-shrink:0}
#octatrace-bench h1{font-size:27px;font-weight:500;line-height:1.2;letter-spacing:-.8px;margin:0}
#octatrace-bench h2{font-size:15px;font-weight:500;margin:0;letter-spacing:-.2px}
#octatrace-bench h3{font-size:13px;font-weight:500;margin:0}
#octatrace-bench p{margin:0}
#octatrace-bench .ob-subtitle{color:var(--ob-muted);font-size:12px;margin-top:8px}
#octatrace-bench .ob-section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#octatrace-bench .ob-section-top .ob-subtitle{margin-top:3px;font-size:11px}
#octatrace-bench .ob-pill{font-size:11px;padding:4px 8px;border-radius:5px;background:var(--ob-paper);color:#5b5f58;white-space:nowrap}
#octatrace-bench .ob-toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 14px;flex-wrap:wrap}
#octatrace-bench .ob-field{display:grid;gap:6px;color:var(--ob-muted);font-size:11px}
#octatrace-bench .ob-field select{border:1px solid var(--ob-line);background:#fff;color:var(--ob-ink);padding:9px 12px;border-radius:8px;max-width:100%;font-size:12px}
#octatrace-bench .ob-buttons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#octatrace-bench .ob-button{background:#fff;border:1px solid #d1d1d1;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
#octatrace-bench .ob-button.dark{background:var(--ob-ink);border-color:var(--ob-ink);color:#fff}
#octatrace-bench .ob-button.orange{background:var(--ob-orange);border-color:var(--ob-orange);color:#151a17}
#octatrace-bench .ob-button.quiet{border:0;padding:4px;background:none;color:var(--ob-muted);font-size:11px}
#octatrace-bench .ob-table-wrap{border:1px solid var(--ob-line);border-radius:10px;overflow-x:auto}
#octatrace-bench table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}
#octatrace-bench th{font-size:11px;font-weight:400;color:var(--ob-muted);background:#fafaf8;padding:11px 12px;border-bottom:1px solid var(--ob-line)}
#octatrace-bench td{height:var(--ob-row);padding:10px 12px;border-bottom:1px solid #eeefeb;vertical-align:middle}
#octatrace-bench tr:last-child td{border-bottom:0}
#octatrace-bench tr.selected td{background:#fff8f2}
#octatrace-bench td:first-child,#octatrace-bench th:first-child{width:36px;padding-right:0}
#octatrace-bench input[type=checkbox]{accent-color:var(--ob-orange);width:15px;height:15px;margin:0;vertical-align:middle}
#octatrace-bench .ob-device{display:flex;align-items:center;gap:10px}
#octatrace-bench .ob-device-icon{width:31px;height:36px;border-radius:7px;background:#efefeb;display:grid;place-items:center;color:#464c48}
#octatrace-bench .ob-device strong{font-weight:500;display:block;white-space:nowrap}
#octatrace-bench .ob-device small,#octatrace-bench .ob-cellsmall{display:block;font-size:11px;color:var(--ob-muted);margin-top:2px}
#octatrace-bench .ob-status{font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap;color:#64685e}
#octatrace-bench .ob-status.pass{color:var(--ob-green)}
#octatrace-bench .ob-status.pending{color:#975215}
#octatrace-bench .ob-status.fail{color:var(--ob-red)}
#octatrace-bench .ob-select-note{font-size:11px;color:var(--ob-muted);margin-top:10px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
#octatrace-bench .ob-split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:24px;margin-top:28px}
#octatrace-bench .ob-checks{margin-top:14px;display:grid}
#octatrace-bench .ob-check{padding:8px 0;border-bottom:1px solid #eeefeb;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:11px}
#octatrace-bench .ob-check small{display:block;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ob-check-result{color:#6f7469;white-space:nowrap;font-size:11px}
#octatrace-bench .ob-check-result.pass{color:var(--ob-green)}
#octatrace-bench .ob-manual{background:var(--ob-paper);padding:10px 12px;border-radius:8px;display:flex;gap:8px;font-size:11px;margin-top:12px;color:#62645d;align-items:flex-start}
#octatrace-bench .ob-metrics{margin-top:17px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
#octatrace-bench .ob-metric-label{font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ob-metric-value{font-size:24px;letter-spacing:-.7px;margin-top:4px;font-variant-numeric:tabular-nums}
#octatrace-bench .ob-metric-value span{font-size:11px;letter-spacing:0;color:var(--ob-muted)}
#octatrace-bench .ob-meter{height:5px;background:#edece7;border-radius:5px;margin:14px 0 8px;overflow:hidden}
#octatrace-bench .ob-meter span{display:block;width:0;height:100%;background:var(--ob-orange)}
#octatrace-bench .ob-plotcaption{display:flex;justify-content:space-between;font-size:11px;color:var(--ob-muted);gap:8px}

&lt;style&gt;
#octatrace-bench{--ob-test-surface:light-dark(#fff,#1c2021);--ob-test-soft:light-dark(#f7f5f1,#272c2d);--ob-test-warn:light-dark(#8c4918,#f8b981);--ob-test-fail:light-dark(#a33d2c,#ffab98)}
#octatrace-bench .ot-heading{display:flex;justify-content:space-between;gap:14px;align-items:start;flex-wrap:wrap}
#octatrace-bench .ot-eyebrow{font-size:11px;color:var(--ob-orange);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
#octatrace-bench .ot-context{display:flex;gap:12px;flex-wrap:wrap;margin:23px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--ob-line)}
#octatrace-bench .ot-context label{flex:1;min-width:180px}
#octatrace-bench .ot-context select{width:100%}
#octatrace-bench .ot-context .ot-run-meta{font-size:11px;color:var(--ob-muted);flex-basis:100%;display:flex;gap:12px;flex-wrap:wrap}
#octatrace-bench .ot-layout{display:grid;grid-template-columns:174px minmax(0,1fr);gap:22px}
#octatrace-bench .ot-steps{margin:0;padding:0;list-style:none;display:grid;align-content:start}
#octatrace-bench .ot-steps li{position:relative;display:flex;gap:10px;padding:10px 0 17px;font-size:12px;align-items:start}
#octatrace-bench .ot-steps li:not(:last-child):before{content:&#x27;&#x27;;position:absolute;left:13px;top:38px;bottom:-5px;width:1px;background:var(--ob-line)}
#octatrace-bench .ot-step-number{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:50%;background:var(--ob-test-soft);color:var(--ob-muted);font-size:11px}
#octatrace-bench .ot-steps .ot-current .ot-step-number{background:var(--ob-orange);color:#111920}
#octatrace-bench .ot-steps .ot-passed .ot-step-number{background:var(--ob-green-soft);color:var(--ob-green)}
#octatrace-bench .ot-steps .ot-failed .ot-step-number{color:var(--ob-test-fail)}
#octatrace-bench .ot-steps strong{display:block;font-weight:500;margin:2px 0}
#octatrace-bench .ot-steps small{display:block;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ot-panel{min-width:0}
#octatrace-bench .ot-action{padding:20px;border:1px solid var(--ob-line);border-radius:12px;background:var(--ob-test-soft)}
#octatrace-bench .ot-action h2{font-size:22px;line-height:1.35;letter-spacing:-.5px;margin:13px 0 11px}
#octatrace-bench .ot-action p{font-size:12px;line-height:1.8}
#octatrace-bench .ot-status-row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ot-state{display:inline-flex;align-items:center;gap:6px;color:var(--ob-test-warn);font-size:11px}
#octatrace-bench .ot-state.good{color:var(--ob-green)}
#octatrace-bench .ot-state.bad{color:var(--ob-test-fail)}
#octatrace-bench .ot-expect{border-top:1px solid var(--ob-line);margin-top:17px;padding-top:13px;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ot-expect span{color:var(--ob-ink);display:block;margin-top:4px;line-height:1.7;font-size:12px}
#octatrace-bench .ot-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px;align-items:center}
#octatrace-bench .ot-attest{display:flex;align-items:start;gap:9px;font-size:12px;margin-top:16px;line-height:1.7}
#octatrace-bench .ot-attest input{flex-shrink:0;margin-top:4px}
#octatrace-bench .ot-issue{margin-top:16px;padding-top:16px;border-top:1px solid var(--ob-line)}
#octatrace-bench .ot-issue label{display:grid;gap:6px;font-size:12px;margin-top:8px}
#octatrace-bench .ot-issue textarea,#octatrace-bench .ot-issue select{background:var(--ob-test-surface);color:var(--ob-ink);border:1px solid var(--ob-line);border-radius:7px;padding:9px;width:100%;font:inherit}
#octatrace-bench .ot-issue textarea{min-height:75px;resize:vertical}
#octatrace-bench .ot-evidence{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ob-green);margin:13px 0 20px;flex-wrap:wrap}
#octatrace-bench .ot-loghead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
#octatrace-bench .ot-loghead label{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ot-loghead select{font-size:11px;border:0;background:var(--ob-test-soft);color:var(--ob-ink);border-radius:5px;padding:6px;max-width:100%}
#octatrace-bench .ot-log{border:1px solid var(--ob-line);border-radius:8px;background:var(--ob-test-surface);overflow:hidden}
#octatrace-bench .ot-event{display:grid;grid-template-columns:69px 58px minmax(0,1fr);gap:9px;padding:9px 11px;border-bottom:1px solid var(--ob-line);font-size:11px;align-items:baseline}
#octatrace-bench .ot-event:last-child{border:0}
#octatrace-bench .ot-event time{color:var(--ob-muted);font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
#octatrace-bench .ot-event .ot-source{color:var(--ob-muted)}
#octatrace-bench .ot-event .ot-detail{overflow-wrap:anywhere;font-family:ui-monospace,monospace;line-height:1.7}
#octatrace-bench .ot-event .ot-detail small{display:block;color:var(--ob-muted);font:inherit}
#octatrace-bench .ot-logfoot{font-size:11px;color:var(--ob-muted);margin-top:9px;line-height:1.7}
#octatrace-bench .ot-history-list{display:grid;margin-top:17px}
#octatrace-bench .ot-history-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:16px 0;background:none;border:0;border-bottom:1px solid var(--ob-line);text-align:left;width:100%}
#octatrace-bench .ot-history-row strong{font-size:13px;font-weight:500;display:block;margin-bottom:5px}
#octatrace-bench .ot-history-row small{font-size:11px;color:var(--ob-muted);display:block;margin-top:5px;line-height:1.7}
#octatrace-bench .ot-history-meta{text-align:right;display:grid;gap:6px;align-content:center;justify-items:end;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ot-record-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:20px 0;font-size:12px}
#octatrace-bench .ot-record-facts dt{font-size:11px;color:var(--ob-muted);margin-bottom:4px}
#octatrace-bench .ot-record-facts dd{margin:0;overflow-wrap:anywhere}
#octatrace-bench .ot-record-steps{margin:16px 0 24px;padding-left:20px;font-size:12px}
#octatrace-bench .ot-record-steps li{padding:8px 0;border-bottom:1px solid var(--ob-line)}
#octatrace-bench .ot-record-steps span{float:right;font-size:11px;margin-left:10px}
#octatrace-bench .ot-json{display:grid;gap:8px;margin-top:18px;font-size:11px;color:var(--ob-muted)}
#octatrace-bench .ot-json textarea{width:100%;height:230px;resize:vertical;border:1px solid var(--ob-line);border-radius:7px;padding:12px;background:var(--ob-test-surface);color:var(--ob-ink);font:11px/1.7 ui-monospace,monospace}
#octatrace-bench .ot-empty{padding:24px 0;color:var(--ob-muted);font-size:12px}
#octatrace-bench .ot-device-link{display:block;border:0;background:none;color:var(--ob-orange);padding:5px 0;font:inherit;font-size:11px}
#octatrace-bench[data-theme=light]{color-scheme:light}
#octatrace-bench[data-theme=dark]{color-scheme:dark}
@media(max-width:850px){#octatrace-bench .ot-layout{grid-template-columns:1fr}#octatrace-bench .ot-steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#octatrace-bench .ot-steps li{padding:0 0 12px}#octatrace-bench .ot-steps li:before{display:none}#octatrace-bench .ot-steps small{display:none}}
@media(max-width:560px){#octatrace-bench .ot-action{padding:15px}#octatrace-bench .ot-steps{grid-template-columns:1fr 1fr}#octatrace-bench .ot-record-facts{grid-template-columns:1fr}#octatrace-bench .ot-event{grid-template-columns:65px minmax(0,1fr);gap:5px 8px}#octatrace-bench .ot-event .ot-source{grid-column:2}#octatrace-bench .ot-event .ot-detail{grid-column:1/-1}#octatrace-bench .ot-history-row{grid-template-columns:1fr}#octatrace-bench .ot-history-meta{justify-items:start;text-align:left;display:flex;flex-wrap:wrap}#octatrace-bench .ot-context label{min-width:0;flex-basis:100%}#octatrace-bench .ob-main{padding:18px 14px}}
&lt;/style&gt;

{id:&#x27;usb&#x27;,title:&#x27;USB timeout &amp; recovery&#x27;,category:&#x27;Testing · Link&#x27;,summary:&#x27;Reply deadlines, incomplete requests and recovery.&#x27;,reference:&#x27;F00-L1 / F00-L2 · USB bench&#x27;,body:`&lt;p&gt;A missing reply is a failed exchange. Keep it visible with the device identity, installed build and original attempt.&lt;/p&gt;&lt;h3&gt;Expected behaviour&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;A normal reply arrives within the existing &lt;strong&gt;3,000 ms&lt;/strong&gt; host deadline and matches the request ID, expected role and build.&lt;/li&gt;&lt;li&gt;An incomplete request expires after &lt;strong&gt;2,000 ms of inactivity&lt;/strong&gt;. That expected error is part of the timeout test; the next valid request must still work.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;When a reply is missing&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Confirm that the selected USB device is the intended Link and has the expected Octatrace build.&lt;/li&gt;&lt;li&gt;Check the cable and connection. Close another bench client if it owns the same device.&lt;/li&gt;&lt;li&gt;Record a new attempt after reconnecting. Preserve the original timeout and its log.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;ob-doc-callout&quot;&gt;A later pass is a separate attempt. It does not erase the earlier failure.&lt;/div&gt;&lt;h3&gt;During a recorded startup&lt;/h3&gt;&lt;p&gt;Use the existing startup monitor. Normal traffic, fault recovery and partial-input timeout are separate scenarios. Wait for recording readiness before an operator restart; this reader sends no reset.&lt;/p&gt;`},

function render(){const historical=tab===&#x27;testhistory&#x27;;$(&#x27;#ot-device&#x27;).value=device;$(&#x27;#ot-profile&#x27;).value=profile;$(&#x27;#ot-profile-field&#x27;).hidden=historical;$(&#x27;#ot-section-label&#x27;).textContent=historical?&#x27;Test history / Per device&#x27;:&#x27;Test bench / Guided test&#x27;;$(&#x27;#ot-title&#x27;).textContent=historical?&#x27;Every attempt stays with the device.&#x27;:&#x27;One step at a time.&#x27;;$(&#x27;#ot-subtitle&#x27;).textContent=historical?&#x27;Firmware and app tests, including failed and interrupted attempts.&#x27;:&#x27;The next action, the expected result, and the evidence together.&#x27;;$(&#x27;#ot-switch&#x27;).innerHTML=historical?&#x27;Back to guided test&#x27;:&#x27;Device history &lt;i data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;const r=active();$(&#x27;#ot-run-meta&#x27;).innerHTML=historical?&#x27;&lt;span&gt;Private device record · illustrative data&lt;/span&gt;&lt;span&gt;History retained across navigation&lt;/span&gt;&#x27;:`&lt;span&gt;${r?r.id+&#x27; · Attempt &#x27;+r.attempt:&#x27;New attempt&#x27;}&lt;/span&gt;&lt;span&gt;${esc(profiles[profile].caseId)}&lt;/span&gt;&lt;span&gt;fw-demo-a${profile===&#x27;background&#x27;?&#x27; / app-demo-a&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;span&gt;Demo operator&lt;/span&gt;`;if(historical){if(detail)record();else history();}else guidance();if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function navigate(next){tab=next;issue=false;sourceFilter=&#x27;All&#x27;;root.dispatchEvent(new CustomEvent(&#x27;workshop-navigate&#x27;,{detail:next}));}
function create(){const previous=runs.find(r=&gt;r.device===device&amp;&amp;r.profile===profile);const run=makeRun(device,profile);if(previous){run.previousAttempt=previous.id;event(run,0,&#x27;Workshop&#x27;,&#x27;New attempt; earlier &#x27;+previous.id+&#x27; retained with outcome &#x27;+previous.status+&#x27;.&#x27;);}tab=&#x27;tests&#x27;;detail=null;issue=false;navigate(&#x27;tests&#x27;);announce(&#x27;New attempt created. Earlier attempts are retained.&#x27;);remember();}

root.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;button&#x27;);if(!b)return;if(b.dataset.testDevice){device=b.dataset.testDevice;detail=null;navigate(&#x27;testhistory&#x27;);remember();return;}if(b.dataset.otRun){detail=b.dataset.otRun;sourceFilter=&#x27;All&#x27;;render();remember();return;}
switch(b.id){
case &#x27;ot-start&#x27;:case &#x27;ot-retry&#x27;:if(b.id===&#x27;ot-retry&#x27;){const r=runs.find(r=&gt;r.id===detail);device=r.device;profile=r.profile;}create();break;

case &#x27;ot-next&#x27;:{const r=active();if(!r)return;const s=profiles[profile].steps[r.current];if(s.attest&amp;&amp;!$(&#x27;#ot-attest&#x27;)?.checked)return;event(r,r.current,s.source,s.event);r.steps[r.current].status=&#x27;Passed&#x27;;if(r.current===r.steps.length-1){r.status=&#x27;Passed&#x27;;r.endedAt=r.events.at(-1).at;detail=r.id;scope=&#x27;run&#x27;;navigate(&#x27;testhistory&#x27;);announce(&#x27;Example attempt saved. Earlier failed or interrupted attempts remain in history.&#x27;);}else{r.current++;event(r,r.current,&#x27;Workshop&#x27;,&#x27;Step &#x27;+(r.current+1)+&#x27; ready · &#x27;+profiles[profile].steps[r.current].kind+&#x27;.&#x27;);issue=false;render();announce(&#x27;Step &#x27;+(r.current+1)+&#x27; of &#x27;+r.steps.length+&#x27;: &#x27;+r.steps[r.current].name);}remember();break;}
case &#x27;ot-issue&#x27;:case &#x27;ot-stop&#x27;:issue=true;issueMode=b.id===&#x27;ot-stop&#x27;?&#x27;Interrupted&#x27;:&#x27;Failed&#x27;;render();$(&#x27;#ot-issue-reason&#x27;).focus();break;
case &#x27;ot-cancel-issue&#x27;:issue=false;render();break;
case &#x27;ot-save-issue&#x27;:{const r=active(),reason=$(&#x27;#ot-issue-reason&#x27;)?.value.trim();if(!r||!reason)return;r.status=$(&#x27;#ot-issue-outcome&#x27;).value;r.reason=reason;r.steps[r.current].status=r.status;event(r,r.current,&#x27;Operator&#x27;,r.status+&#x27;: &#x27;+reason);r.endedAt=r.events.at(-1).at;issue=false;detail=r.id;navigate(&#x27;testhistory&#x27;);announce(&#x27;Observation saved. Remaining steps are Not run.&#x27;);remember();break;}

case &#x27;ot-export&#x27;:{const r=runs.find(r=&gt;r.id===detail);if(!r)return;const existing=$(&#x27;#ot-json-record&#x27;);if(existing){existing.remove();b.textContent=&#x27;View full record&#x27;;break;}const label=document.createElement(&#x27;label&#x27;);label.id=&#x27;ot-json-record&#x27;;label.className=&#x27;ot-json&#x27;;label.textContent=&#x27;Complete example record · select text to copy&#x27;;const textarea=document.createElement(&#x27;textarea&#x27;);textarea.readOnly=true;textarea.value=JSON.stringify({status:&#x27;simulated_design_record&#x27;,run:r},null,2);label.appendChild(textarea);$(&#x27;#ot-work&#x27;).appendChild(label);b.textContent=&#x27;Hide full record&#x27;;announce(&#x27;Complete record shown, including every step and event.&#x27;);break;}

$(&#x27;#ot-work&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{if(e.target.id===&#x27;ot-attest&#x27;)$(&#x27;#ot-next&#x27;).disabled=!e.target.checked;if(e.target.id===&#x27;ot-issue-outcome&#x27;)issueMode=e.target.value;if(e.target.id===&#x27;ot-log-source&#x27;){sourceFilter=e.target.value;render();}if(e.target.id===&#x27;ot-log-scope&#x27;){scope=e.target.value;render();}});

    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,

    focusout: handleLeave,

  const handleEvent = (event) =&gt; {

      observer.disconnect();

    closeTooltip(false);
