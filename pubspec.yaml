name: octatrace_workshop
description: Octatrace device preparation and diagnostics for macOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.5 <3.14.0'
  flutter: '>=3.47.6 <3.48.0'
dependencies:
  flutter:
    sdk: flutter
  app_links: 7.2.2
  supabase: 2.16.2
  flutter_svg: 2.3.0
  crypto: 3.0.7
  http: 1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Excon
      fonts:
        - asset: assets/fonts/Excon-Regular.otf
        - asset: assets/fonts/Excon-Medium.otf
          weight: 500
