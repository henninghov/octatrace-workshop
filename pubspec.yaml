name: octatrace_workshop
description: Octatrace device preparation and diagnostics for macOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.5 <3.14.0'
  flutter: '>=3.47.6 <3.48.0'
dependencies:
  flutter:
    sdk: flutter
  app_links: 7.2.2
  supabase: 2.16.2
  flutter_svg: 2.3.0
  crypto: 3.0.7
  http: 1.6.0
  qr_flutter: 4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - tools/firmware_test_adapter.py
    - assets/bench/firmware-host-regression.v1.json
    - assets/bench/firmware-host-regression.v2.json
    - assets/bench/firmware-host-regression.v3.json
    - assets/bench/firmware-host-regression.v4.json
    - assets/bench/firmware-host-regression.v5.json
    - assets/bench/firmware-host-regression.v6.json
    - assets/bench/firmware-host-regression.v7.json
    - assets/bench/firmware-host-regression.v8.json
    - assets/branding/
    - assets/bench/provisioned-identity.v1.json
    - assets/bench/provisioned-identity.v2.json
    - assets/bench/credential-inspection.v1.json
    - assets/bench/credential-readiness.v1.json
    - assets/bench/credential-readiness.v2.json
    - assets/bench/startup-diagnostics.v1.json
    - assets/bench/c83-crypto-probe.v1.json
    - assets/bench/c83-crypto-reentry.v1.json
    - assets/bench/c83-crypto-keys.v1.json
    - assets/bench/c83-rtc2-observation.v1.json
    - assets/bench/c83-rtc2-observation.v2.json
    - assets/bench/c83-permanent-peer-handshake.v1.json
    - assets/bench/c841-phone-link-discovery.v1.txt
    - assets/bench/c83-temporary-recovery.v1.json
    - assets/bench/credential-delivery.v1.json
    - assets/bench/credential-installation.v1.json
    - assets/bench/credential-installation.v2.json
    - assets/bench/credential-intent-stop.v1.json
    - assets/bench/credential-intent-stop.v2.json
    - assets/bench/credential-preparation.v1.json
    - assets/bench/credential-preparation.v2.json
    - assets/bench/claimed_update_proof.py
    - assets/bench/claimed-firmware-update.v1.json
    - assets/bench/claimed-firmware-update.v2.json
    - assets/bench/claimed-firmware-update.v3.json
    - assets/bench/claimed-firmware-update.v4.json
    - assets/bench/claimed-firmware-update.v5.json
    - assets/bench/claimed-firmware-update.v6.json
    - assets/bench/claimed-firmware-update.v7.json
    - assets/bench/claimed-firmware-update.v8.json
    - assets/bench/claimed-firmware-update.v9.json
    - assets/bench/claimed-firmware-update.v10.json
    - assets/bench/claimed-firmware-update.v11.json
  fonts:
    - family: Excon
      fonts:
        - asset: assets/fonts/Excon-Regular.otf
        - asset: assets/fonts/Excon-Medium.otf
          weight: 500
